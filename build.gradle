plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = 'com.simpleproximitychat'

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            args '--nogui'
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    // Simple Voice Chat API
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    // Curios API
    maven { url = 'https://maven.theillusivec4.top/' }
    // Jars locales en libs/ (Simple Radio)
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Solo para compilar: en el juego los aportan los propios mods instalados.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")

    // Simple Radio: solo para compilar las torres (radio/TowerBridge). Pon su jar en libs/:
    //   libs/simpleradio-forge-1.20.1-4.6.7.10.jar
    compileOnly fg.deobf("blank:simpleradio-forge:${simpleradio_version}")

    // VibrativeVoice NO se necesita para compilar: se usa por reflexión (compat/VibrativeCompat).
}

tasks.named('processResources', ProcessResources).configure {
    def props = [mod_version: mod_version]
    inputs.properties props
    filesMatching('META-INF/mods.toml') {
        expand props
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
